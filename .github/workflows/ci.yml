name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # l'atelier construit sa bibliothèque (vignettes) avec Pillow et PyYAML
      - run: python3 -m pip install --quiet pillow pyyaml
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
